name: Auto Update All Node Files

on:
  schedule:
    # 北京时间 12:10 (对应 UTC 04:10)
    - cron: '10 4 * * *'
  workflow_dispatch:

jobs:
  run-all-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Puppeteer 依赖
        run: npm install puppeteer

      - name: 第一步：抓取节点并生成 quanbu.txt 和国家文件
        run: node process.js

      - name: 第二步：从中提取关键词文件
        run: node extract_keywords.js

      - name: 提交并推送所有 .txt 文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update all node files $(date '+%Y-%m-%d %H:%M:%S')" && git push)
