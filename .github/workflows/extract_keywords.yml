name: Extract Keyword Files

on:
  push:
    paths:
      - 'quanbu.txt' # 当 quanbu.txt 发生变动时触发
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行关键词提取脚本
        run: node extract_keywords.js

      - name: 提交并推送所有关键词文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update keyword node files $(date '+%Y-%m-%d %H:%M:%S')" && git push)
